<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="MADHYUM GROUP CRM — Admin, BDM and Agent mobile portal">
  <title>MADHYUM GROUP CRM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon/icon-192.png">
  <link rel="apple-touch-icon" href="icon/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <section id="loginView" class="login-view">
    <div class="login-shell">
      <div class="login-topline">CONNECT <i></i> COLLABORATE <i></i> GROW</div>
      <div class="login-panel">
        <img class="login-logo" src="madhyum-brand.png" alt="MADHYUM GROUP — Sabse Bharosemand Zariya">
        <div class="logo-divider"></div>
        <h1 class="login-crm">CRM</h1>
        <p class="login-subtitle">One secure login for Admin, BDM and Agent.</p>

        <div class="role-tabs" aria-label="Select login type">
          <button id="agentLoginTab" class="active" type="button">♟&nbsp; Agent / BDM</button>
          <button id="adminLoginTab" type="button">◇&nbsp; Admin</button>
        </div>

        <form id="loginForm" novalidate>
          <label class="login-label" for="loginId">LOGIN ID / EMAIL</label>
          <div class="login-input-wrap"><span>◯</span><input id="loginId" type="text" autocomplete="username" placeholder="Enter Agent / BDM ID" required></div>
          <label class="login-label" for="loginPassword">PASSWORD</label>
          <div class="login-input-wrap"><span>▢</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required><button id="togglePassword" type="button" aria-label="Show or hide password">◉</button></div>
          <div class="login-options"><label class="remember"><input type="checkbox"> <span>Remember me</span></label><span class="forgot">Forgot password?</span></div>
          <button id="loginButton" class="login-btn" type="submit">Login <span>→</span></button>
          <div id="loginMessage" class="login-message" role="alert"></div>
        </form>
      </div>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <header class="app-header">
      <div class="app-brand-row">
        <div><div class="app-brand">MADHYUM GROUP</div><div class="app-crm">CRM</div></div>
        <button id="refreshButton" class="avatar" type="button" aria-label="Refresh CRM">↻</button>
      </div>
      <div class="role-pill" id="screenTitle">Dashboard</div>
      <h1 id="userLine">Loading...</h1>
      <p>Everything that needs attention, in one place.</p>
    </header>
    <main id="mainContent" class="main-content"></main>
    <nav id="bottomNav" class="bottom-nav" aria-label="CRM navigation"></nav>
  </section>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js" defer></script>
</body>
</html>
