<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MADHYUM CRM">
  <title>MADHYUM CRM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon/icon-192.png">
  <link rel="apple-touch-icon" href="icon/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="loginView" class="login-view">
    <div class="login-shell">
      <div class="login-topline">CONNECT <span>|</span> COLLABORATE <span>|</span> GROW</div>
      <div class="login-card">
        <div class="login-brand-panel">
          <img src="madhyum-brand.png" alt="MADHYUM Group" class="login-brand-image">
        </div>
        <div class="login-divider"></div>
        <div class="crm-product-label"><span>CRM</span></div>
        <p class="login-subtitle">One secure login for Admin, BDM and Agent.</p>

        <div class="segmented" role="tablist" aria-label="Login type">
          <button class="seg active" id="agentLoginTab" type="button"><span class="seg-icon">👥</span>Agent / BDM</button>
          <button class="seg" id="adminLoginTab" type="button"><span class="seg-icon">◇</span>Admin</button>
        </div>

        <form id="loginForm" autocomplete="on">
          <label class="field-label" for="loginId">ID</label>
          <div class="login-input-wrap">
            <span class="login-input-icon" aria-hidden="true">○</span>
            <input id="loginId" class="input login-input" autocomplete="username" placeholder="Enter Agent / BDM ID" required>
          </div>

          <label class="field-label" for="loginPassword">PASSWORD</label>
          <div class="password-wrap login-input-wrap">
            <span class="login-input-icon" aria-hidden="true">▢</span>
            <input id="loginPassword" class="input login-input" type="password" autocomplete="current-password" placeholder="Enter password" required>
            <button id="togglePassword" class="icon-btn inside login-eye" type="button" aria-label="Show password">◉</button>
          </div>

          <div class="login-options">
            <label class="remember-control"><input id="rememberLogin" type="checkbox"><span></span>Remember me</label>
            <button id="forgotPasswordLink" type="button" class="forgot-link">Forgot password?</button>
          </div>

          <button id="loginButton" class="primary-btn login-primary" type="submit">Login <span>→</span></button>
          <div id="loginMessage" class="form-message"></div>
        </form>

        <div class="login-values"><span></span>PEOPLE <b>|</b> OPPORTUNITIES <b>|</b> PROGRESS<span></span></div>
        <div class="wing-strip" aria-label="MADHYUM business wings">
          <div class="wing-item"><div class="wing-glyph">⌂</div><small>REAL ESTATE</small></div>
          <div class="wing-item"><div class="wing-glyph">✈</div><small>TRAVEL</small></div>
          <div class="wing-item"><div class="wing-glyph">◇</div><small>ADMISSION</small></div>
          <div class="wing-item"><div class="wing-glyph">▣</div><small>CONSULTANCY</small></div>
          <div class="wing-item"><div class="wing-glyph">□</div><small>EVENTS</small></div>
        </div>
      </div>
      <div class="login-script">Your Requirement,<br>Our Network</div>
    </div>
  </section>

  <section id="appView" class="app-view hidden">
    <header class="app-header">
      <div>
        <div class="eyebrow">MADHYUM GROUP</div>
        <h2 id="screenTitle">Dashboard</h2>
        <div id="userLine" class="user-line"></div>
      </div>
      <button id="refreshButton" class="icon-btn" type="button" aria-label="Refresh">↻</button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Primary navigation"></nav>
  </section>

  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
